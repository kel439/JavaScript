<body>
    <h1>Menu de Opções</h1>
    <p>1 - Contas a pagar</p>
    <p>2 - Contas a receber</p>
    <p>3 - Controle de estoque</p>
    <p>4 - Relatório</p>
    <p>5 - Backup</p>
      
   

    <form>
        <p>Digite sua opção:
            <input type="number" id="inOpcao" required>
        </p>
        <input type="button" value="Mostrar resposta" onclick="resposta()">
    </form>
    <h3></h3>
    <script>

        const frm = document.querySelector("form");
        const resp = document.querySelector("h3");

       

        function resposta() {
            let opcao = Number(frm.inOpcao.value);

             switch (opcao) {
            case 1 : 
                resp.innerText = "Você escolheu o sistema Contas a pagar";
                break;
            case 2 : 
                resp.innerText = "Você escolheu o sistema Contas a receber";
                break;
            case 3 : 
                resp.innerText = "Você escolheu o sistema Controle de estoque";
                break;
            case 4 : 
                resp.innerText = "Você escolheu o sistema Relatorio";
                break;
            case 5 : 
                resp.innerText = "Você escolheu o sistema Backup";
                break
            default : 
                resp.innerText = "Essa opção não existe";
        }
            
        }
