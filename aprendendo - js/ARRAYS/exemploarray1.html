<script>
const cidades = ["Ribeirao Preto"]; // declara e define o valor inicial do array

cidades.push("Serrana");            // adiciona cidade ao final do vetor
console.log(cidades);               // (Ribeirao Preto , Serrana)

cidades.unshift("Sertaozinho");     // adiciona ao inicio e desloca as demais cidades
console.log(cidades);               // (Sertaozinho, Ribeirao Preto, Serrana)

console.table(cidades);             // mostra array na forma de tabela

console.log(cidades.toString());
console.log(cidades.join( " - "));
for (const cidade of cidades) {
    console.log(cidade)
}

cidades.forEach((cidade, i) => {
    console.log( `${i+1}ª Cidade: ${cidade}`);
    })

const ultima = cidades.pop();      // remove a ultima cidade do vetor
console.log(cidades);              // (Sertaozinho, Ribeirao Preto)

const primeira = cidades.shift();    // remove a primeira cidade e sobe as demais ou desloca para esquerda
console.log(cidades);                // (Ribeirao Preto)

console.log(ultima)
console.log(primeira)

 const numeros = [5, 10, 15, 20]
     let soma = 0
     numeros.forEach(num => soma += num)
     console.log(`Soma dos Números: ${soma}`)
 


</script>
