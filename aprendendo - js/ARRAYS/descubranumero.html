<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="IMG/js.png">
    <link rel="stylesheet" href="CSS/Estilos.css">
    <title>Descubra o numero</title>
</head>
<body>
    <img src="IMG/descubranumero.jpg" alt="Jogo dos Números" class="normal">
    <h1>Jogo Descubra o Número</h1>

    <form>
        <p>Número:
            <input type="number" min="1" max="100" id="inNumero" required autofocus>
            <input type="submit" value="Apostar" id="btSubmit">
            <input type="button" value="Jogar Novamente" id="btNovo" class="oculta">
        </p>
    </form>
    <h3>Erros: <span id="outErros">0</span></h3>
    <h3>Chances: <span id="outChances">6</span></h3>
    <h3 id="outDica" class="italico">Dicas: É um nímero entre 1 e 100</h3>

    <script src="JS/descubranumero.js"></script>
</body>
</html>
