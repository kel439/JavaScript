<script>
const letras = ["A" , "B" , "C" , "D" ];              // declara e define contesxto inicial do array
const letras2 = letras.slice(-2);                     // obtem as duas ultimas letras
const letras3 = letras.slice(0,-1);                   // obtem do inicio ate o final exceto a ultima
console.log(letras);                                  // "A" , "B" , "C" , "D" 
console.log(letras2);                                 //  C" , "D"
console.log(letras3);                                 // "A" , "B" , "C" 

const retira = letras.splice(2, 1);                   // remove apartir da posicao 2 um elemento
console.log(letras);                                  // "A" , "B" , "D"
console.log(retira);                                  // "C"


</script>
