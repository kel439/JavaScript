<script>
    let num;   //declarar uma variavel num com let, pois ela pode ser alterada
               //e será acessada fora do bloco DO WHILE
    do {
        num = Number(prompt("Numero: "));   // lê um numero
        if (num == 0 || isNaN(num)){
            alert("Digite um número válido...");
        }

    } while (num == 0 || isNaN(num))    // enquanto num invalido

    let pares = `Pares entre 1 e ${num}: `; // string que ira conter a resposta
    
    for (let i = 2; i < num; i = i += 2){
        pares = pares + i + ", ";
    }

    pares = pares + num + ".";
    alert(pares);
</script>
