<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="IMG/js.png">
    <link rel="stylesheet" href="CSS/Estilos.css">
    <title>Revenda Veiculos</title>
</head>
<body>
    
    <img src="IMG/exerc1.jpg" alt="Revenda de veiculo" class="alta">
    <h1>Revenda de Veículos</h1>

    <form>
        <p>Modelo:
            <input type="text" id="inModelo" required autofocus>
        </p>
        <p>Preço R$: 
            <input type="number" id="inPreco" required>
            <input type="submit" value="Adicionar">
        </p>
        <input type="button" value="Listar Todos" id="btListar">
        <input type="button" value="Filtrar por Preço" id="btFiltrar">
        <input type="button" value="Simular Promoção" id="btSimular">

    </form>

    <pre></pre>
    <script src="js/revenda.js"></script>

</body>
</html>
